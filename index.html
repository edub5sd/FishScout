<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spot Finder & Live Crew Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      z-index: 20;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .brand h1 { font-size: 1.05rem; font-weight: 700; color: #38bdf8; cursor: pointer; user-select: none; }
    .badge { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; font-size: 0.65rem; font-weight: 600; padding: 2px 6px; border-radius: 999px; }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .input-dark { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 5px 8px; color: #f8fafc; font-size: 0.78rem; outline: none; }
    .input-dark:focus { border-color: #38bdf8; }

    .btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn:hover { background: #0062cc; }

    #weather-display {
      font-size: 0.76rem;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      gap: 6px;
      align-items: center;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    #main-wrapper {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #chat-sidebar {
      width: 350px;
      background: #000000;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      z-index: 5;
      position: relative;
    }

    .chat-header {
      padding: 8px 10px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .channel-picker {
      background: #09090b;
      border: 1px solid #3f3f46;
      color: #38bdf8;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
    }

    .user-account-bar {
      padding: 6px 10px;
      background: #121214;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      font-size: 0.74rem;
    }

    .btn-link {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.7rem;
      cursor: pointer;
      text-decoration: underline;
    }

    #auth-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .auth-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #18181b;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .auth-input {
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 8px 10px;
      color: #f8fafc;
      font-size: 0.82rem;
      outline: none;
    }

    .auth-btn {
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    #auth-error {
      font-size: 0.72rem;
      color: #f87171;
      text-align: center;
      min-height: 14px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #000000;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      max-width: 86%;
    }

    .message-group.theirs { align-self: flex-start; align-items: flex-start; }
    .message-group.theirs .bubble {
      background-color: #26252a;
      color: #ffffff;
      border-radius: 18px 18px 18px 4px;
    }
    .message-group.theirs .msg-sender { color: #a1a1aa; margin-left: 6px; }

    .message-group.mine { align-self: flex-end; align-items: flex-end; }
    .message-group.mine .bubble {
      background-color: #007aff;
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
    }
    .message-group.mine .msg-sender { color: #93c5fd; margin-right: 6px; }

    .msg-sender { font-size: 0.65rem; font-weight: 600; margin-bottom: 2px; }
    .bubble {
      padding: 8px 13px;
      font-size: 0.88rem;
      line-height: 1.35;
      word-break: break-word;
      position: relative;
    }

    /* Message Actions Tray */
    .msg-actions {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .msg-actions:hover { opacity: 1; }
    .action-chip {
      background: #18181b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .action-chip:hover { color: #38bdf8; border-color: #38bdf8; }

    .msg-time { font-size: 0.6rem; color: #71717a; margin-top: 2px; }

    /* NEW TEXTING COMPOSE BAR WITH iMESSAGE & ANDROID BUTTONS */
    .chat-compose-container {
      padding: 8px 10px;
      background: #121214;
      border-top: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .compose-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .sms-input {
      flex: 1;
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 20px;
      padding: 8px 14px;
      color: #f4f4f5;
      font-size: 0.84rem;
      outline: none;
    }
    .sms-input:focus { border-color: #007aff; }

    .send-main-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #007aff;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: bold;
    }

    .external-text-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .text-channel-tag {
      font-size: 0.65rem;
      color: #64748b;
      font-weight: 600;
    }

    .text-buttons-row {
      display: flex;
      gap: 5px;
    }

    .imessage-btn {
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .imessage-btn:hover { background: #0062cc; }

    .android-btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .android-btn:hover { background: #16a34a; color: #fff; }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: #0b1120;
    }

    iframe { width: 100%; height: 100%; border: none; }

    #egg-toast {
      position: fixed;
      bottom: 60px;
      right: 16px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 2px solid #7dd3fc;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      z-index: 300;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1 id="app-title-btn">🎣 Spot Finder</h1>
      <span class="badge">Crew Edition</span>
    </div>

    <div class="header-actions">
      <button id="kai-add-room-btn" class="btn" style="background:#7c3aed; display:none;" onclick="openCreateChannelModal()">➕ New Chat</button>
      <button class="btn" style="background:#0284c7;" onclick="openCatchModal()">🐟 Log Catch</button>
      <button class="btn" style="background:#0ea5e9;" onclick="openLogbookModal()">📖 All Catches</button>
      <button class="btn" style="background:#059669;" onclick="openTripModal()">📍 Plan Trip</button>
      
      <div style="display:flex; align-items:center; gap:5px; margin-left:4px;">
        <input type="text" id="location-input" class="input-dark" style="width: 95px;" placeholder="Location..." value="Poway" />
        <button class="btn" onclick="fetchWeatherUserTrigger()">Weather</button>
      </div>

      <div id="weather-display">
        <span id="weather-stats">Loading weather...</span>
      </div>
    </div>
  </header>

  <div id="main-wrapper">
    <aside id="chat-sidebar">
      <div class="chat-header">
        <span style="display:flex; align-items:center;">
          <span id="conn-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#34c759;margin-right:5px;"></span>
          <span id="conn-text" style="color:#d4d4d8;">Live Sync</span>
        </span>
        <select id="channel-dropdown" class="channel-picker" onchange="attemptChannelSwitch(this.value)"></select>
      </div>

      <div class="user-account-bar">
        <div style="display:flex;align-items:center;gap:5px;color:#38bdf8;font-weight:600;">
          <span>👤</span>
          <span id="display-username">Not Signed In</span>
        </div>
        <button class="btn-link" onclick="handleExplicitLogout()">Log Out 🔒</button>
      </div>

      <!-- ZERO-PERSISTENCE AUTH OVERLAY -->
      <div id="auth-overlay">
        <div class="auth-box">
          <h2 id="auth-title-label">Angler Sign In</h2>
          <p id="auth-room-hint" style="font-size:0.72rem;color:#94a3b8;text-align:center;">Enter your credentials to unlock the chat.</p>
          <input type="text" id="auth-username" class="auth-input" placeholder="Your Name / Handle" autocomplete="off" />
          <input type="password" id="auth-userpass" class="auth-input" placeholder="Account Password" autocomplete="new-password" />
          <input type="password" id="auth-roompass" class="auth-input" placeholder="Room Passcode" autocomplete="new-password" />
          <button class="auth-btn" onclick="handleAuthSubmit()">Unlock Room 🎣</button>
          <div id="auth-error"></div>
        </div>
      </div>

      <div id="messages-box" class="chat-messages"></div>

      <!-- VISIBLE iMESSAGE & ANDROID TEXTING BAR -->
      <div class="chat-compose-container">
        <div class="compose-input-row">
          <input type="text" id="message-text" class="sms-input" placeholder="Text message..." />
          <button class="send-main-btn" onclick="sendMessage()" title="Send to in-app Crew Chat">↑</button>
        </div>

        <div class="external-text-toolbar">
          <span class="text-channel-tag">Also text via phone:</span>
          <div class="text-buttons-row">
            <button class="imessage-btn" onclick="sendViaAppleMessages()" title="Send through Apple iMessage">
              💬 iMessage
            </button>
            <button class="android-btn" onclick="sendViaAndroidSMS()" title="Send through Android Messages">
              🤖 Android SMS
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main id="map-container">
      <iframe 
        id="map-frame"
        src="https://take-me-fishing.fishbrain.com/en-embedded/" 
        allow="geolocation; camera; microphone"
        title="Interactive Fishing Map">
      </iframe>
    </main>
  </div>

  <div id="egg-toast"></div>

  <script>
    const DEFAULT_ROOMS = {
      'green-valley-ward-fishing': {
        name: '#green-valley-ward-fishing',
        topic: 'green-valley-ward-fishing',
        passcode: 'GV24'
      }
    };

    let channels = JSON.parse(localStorage.getItem('app_group_channels') || JSON.stringify(DEFAULT_ROOMS));
    let currentTopic = 'green-valley-ward-fishing';
    let pendingSwitchTopic = null;
    let client = null;
    let currentActiveUser = null;
    let unlockedRoomsInRAM = new Set();
    const seenMsgIds = new Set();
    const clientId = 'fish_scout_' + Math.random().toString(16).substring(2, 10);

    // BROWSER & PHONE TEXTING DISPATCHERS
    function getDraftMessage() {
      const input = document.getElementById('message-text');
      const text = input.value.trim();
      return { input, text: text || 'Hey crew, check out Spot Finder!' };
    }

    // 1. Apple iMessage Opener (Uses iOS syntax)
    function sendViaAppleMessages() {
      const { input, text } = getDraftMessage();
      const payload = `${text}\n\nSent from Spot Finder: ${window.location.href}`;
      const url = `sms:&body=${encodeURIComponent(payload)}`;
      window.location.href = url;
      showToast("💬 Opening Apple iMessage...");
    }

    // 2. Android SMS Opener (Uses Android/RFC syntax)
    function sendViaAndroidSMS() {
      const { input, text } = getDraftMessage();
      const payload = `${text}\n\nSent from Spot Finder: ${window.location.href}`;
      const url = `sms:?body=${encodeURIComponent(payload)}`;
      window.location.href = url;
      showToast("🤖 Opening Android Messages...");
    }

    // Share specific chat bubble content out to phone contacts
    function shareMessageText(rawText) {
      const payload = `${rawText}\n\nSent from Spot Finder: ${window.location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'Spot Finder Chat', text: payload }).catch(() => {});
      } else {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        window.location.href = `sms:${isIOS ? '&' : '?'}body=${encodeURIComponent(payload)}`;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('egg-toast');
      toast.innerHTML = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function updateChannelDropdownUI() {
      const dropdown = document.getElementById('channel-dropdown');
      dropdown.innerHTML = '';
      Object.keys(channels).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = channels[key].name;
        if (key === currentTopic) opt.selected = true;
        dropdown.appendChild(opt);
      });
      document.getElementById('message-text').placeholder = `Text ${channels[currentTopic]?.name || 'crew'}...`;
    }

    function attemptChannelSwitch(targetTopic) {
      if (targetTopic === currentTopic) return;
      const isKai = currentActiveUser && currentActiveUser.toLowerCase() === 'kai';
      if (isKai || unlockedRoomsInRAM.has(targetTopic)) {
        finishChannelSwitch(targetTopic);
      } else {
        pendingSwitchTopic = targetTopic;
        document.getElementById('auth-overlay').style.display = 'flex';
        document.getElementById('auth-title-label').textContent = `Unlock ${channels[targetTopic]?.name || 'Chat'}`;
        document.getElementById('auth-username').value = currentActiveUser || '';
        document.getElementById('auth-userpass').value = '';
        document.getElementById('auth-roompass').value = '';
        document.getElementById('auth-error').textContent = '';
      }
    }

    function finishChannelSwitch(newTopic) {
      currentTopic = newTopic;
      pendingSwitchTopic = null;
      updateChannelDropdownUI();
      renderSavedHistory(currentTopic);
    }

    function handleAuthSubmit() {
      const nameInput = document.getElementById('auth-username').value.trim();
      const userPassInput = document.getElementById('auth-userpass').value.trim();
      const roomPassInput = document.getElementById('auth-roompass').value.trim();
      const errBox = document.getElementById('auth-error');
      errBox.textContent = '';

      if (!nameInput || !userPassInput || !roomPassInput) {
        errBox.textContent = 'All 3 fields required.';
        return;
      }

      const lowerName = nameInput.toLowerCase();
      const userVault = JSON.parse(localStorage.getItem('sec_user_vault') || '{}');

      if (userVault[lowerName]) {
        if (userVault[lowerName] !== userPassInput) {
          errBox.textContent = 'Incorrect password for this user.';
          return;
        }
      } else {
        userVault[lowerName] = userPassInput;
        localStorage.setItem('sec_user_vault', JSON.stringify(userVault));
      }

      const targetRoomTopic = pendingSwitchTopic || currentTopic;
      const expectedPass = channels[targetRoomTopic]?.passcode || 'GV24';

      if (roomPassInput !== expectedPass) {
        errBox.textContent = 'Incorrect room passcode. Access denied.';
        return;
      }

      currentActiveUser = nameInput;
      unlockedRoomsInRAM.add(targetRoomTopic);

      if (pendingSwitchTopic) {
        finishChannelSwitch(pendingSwitchTopic);
      }

      completeLogin();
    }

    function completeLogin() {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('display-username').textContent = currentActiveUser;
      updateChannelDropdownUI();
      renderSavedHistory(currentTopic);
    }

    function handleExplicitLogout() {
      currentActiveUser = null;
      unlockedRoomsInRAM.clear();
      document.getElementById('auth-username').value = '';
      document.getElementById('auth-userpass').value = '';
      document.getElementById('auth-roompass').value = '';
      document.getElementById('auth-error').textContent = '';
      document.getElementById('display-username').textContent = 'Not Signed In';
      document.getElementById('auth-overlay').style.display = 'flex';
      renderSavedHistory(currentTopic);
    }

    function initChat() {
      client = new Paho.MQTT.Client('broker.emqx.io', 8084, clientId);
      client.onMessageArrived = onMessageArrived;
      client.connect({
        useSSL: true,
        timeout: 5,
        keepAliveInterval: 30,
        cleanSession: false,
        onSuccess: () => {
          client.subscribe('fishbrain_group_chat/+', { qos: 1 });
        }
      });
    }

    function onMessageArrived(message) {
      try {
        const payload = JSON.parse(message.payloadString);
        const destinationTopic = message.destinationName.replace('fishbrain_group_chat/', '');

        if (payload.id && seenMsgIds.has(payload.id)) return;
        seenMsgIds.add(payload.id);

        const messageChannel = payload.channel || destinationTopic || currentTopic;
        persistMessageLocally(messageChannel, payload);

        if (messageChannel === currentTopic) {
          appendMessageToUI(payload);
        }
      } catch (e) {}
    }

    function sendMessage() {
      const input = document.getElementById('message-text');
      const text = input.value.trim();
      if (!text || !currentActiveUser) return;

      const payload = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        sender: currentActiveUser,
        text: text,
        channel: currentTopic,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      const message = new Paho.MQTT.Message(JSON.stringify(payload));
      message.destinationName = `fishbrain_group_chat/${currentTopic}`;
      message.qos = 1;
      client.send(message);

      input.value = '';
    }

    function appendMessageToUI(msg) {
      const box = document.getElementById('messages-box');
      const isMe = currentActiveUser && msg.sender.toLowerCase() === currentActiveUser.toLowerCase();

      const group = document.createElement('div');
      group.className = `message-group ${isMe ? 'mine' : 'theirs'}`;

      group.innerHTML = `
        <span class="msg-sender">${escapeHtml(msg.sender)}</span>
        <div class="bubble">
          ${escapeHtml(msg.text)}
        </div>
        <div class="msg-actions">
          <button class="action-chip" onclick="shareMessageText('${escapeHtml(msg.text)}')">📲 Forward Text</button>
        </div>
        <span class="msg-time">${escapeHtml(msg.time)}</span>
      `;

      box.appendChild(group);
      box.scrollTop = box.scrollHeight;
    }

    function persistMessageLocally(channel, msg) {
      const storeKey = `chat_history_${channel}`;
      const history = JSON.parse(localStorage.getItem(storeKey) || '[]');
      history.push(msg);
      if (history.length > 100) history.shift();
      localStorage.setItem(storeKey, JSON.stringify(history));
    }

    function renderSavedHistory(channel) {
      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      seenMsgIds.clear();

      const storeKey = `chat_history_${channel}`;
      const history = JSON.parse(localStorage.getItem(storeKey) || '[]');

      history.forEach(msg => {
        if (!seenMsgIds.has(msg.id)) {
          seenMsgIds.add(msg.id);
          appendMessageToUI(msg);
        }
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateChannelDropdownUI();
      handleExplicitLogout();
      initChat();
    });

    document.getElementById('message-text').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
